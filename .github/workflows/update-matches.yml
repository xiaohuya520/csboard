name: Update matches

# 把 CS2 赛程/比分抓成 cs_matches.json 提交到 main 分支。
#
# 三个触发源,schedule 只是其中之一 —— GitHub 的定时触发并不保证一定发生
# (实测本仓库挂了 10 小时、cron 是 */10,运行次数却是 0)。所以额外加了 push:
# 推一次 .github/data-ping.txt 就能确定性地跑一轮。
# 注意:workflow_dispatch 需要 Actions 写权限,手上的 token 没有,别指望它。
on:
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/data-ping.txt"
      - "tools/update_matches.py"
      - ".github/workflows/update-matches.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-matches
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and build cs_matches.json
        run: python3 tools/update_matches.py --out cs_matches.json

      - name: Commit when changed
        id: commit
        run: |
          # bo3_cache.json 是队名/赛事名的本地缓存,提交上去下轮就不用重查几十次接口。
          git add -A cs_matches.json tools/bo3_cache.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no change"
            exit 0
          fi
          git config user.name  "csboard-bot"
          git config user.email "csboard-bot@users.noreply.github.com"
          git commit -m "data: refresh CS2 matches"
          git pull --rebase --autostash origin main
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # jsDelivr 会缓存分支内容,更新后必须主动清一次;
      # 注意 purge 端点只接受 GET(POST 会 405)。
      - name: Purge jsDelivr cache
        if: steps.commit.outputs.changed == 'true'
        run: |
          for host in cdn fastly gcore testingcf; do
            curl -fsS --max-time 20 "https://${host}.jsdelivr.net/gh/${{ github.repository }}@main/cs_matches.json" \
              && echo "purged via ${host}" || echo "purge via ${host} failed (ignored)"
          done
