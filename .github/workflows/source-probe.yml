name: source-probe

# 临时探测(用完即删)。为 bo3.gg 数据管道确认:日期过滤 / 队名 / 赛事名。
on:
  push:
    paths:
      - ".github/probe-trigger.txt"
      - ".github/workflows/source-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: bo3.gg pipeline prerequisites
        run: |
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
          bo3() {
            curl -s -o /tmp/b -w "%{http_code}" -m 30 -A "$UA" \
              -H "Origin: https://bo3.gg" -H "Referer: https://bo3.gg/" \
              -H "Accept: application/json" --compressed "$1"
          }
          dump() {
            echo "----------------------------------------------------------"
            echo "PATH: $1"
            code=$(bo3 "https://api.bo3.gg/api/v1/$1")
            echo "http=$code bytes=$(wc -c < /tmp/b)"
            python3 -c "
          import json,sys
          try: d=json.load(open('/tmp/b'))
          except Exception as e: print(' parse fail',e); raise SystemExit
          if isinstance(d,dict) and 'results' in d:
              print(' total.count =', (d.get('total') or {}).get('count'))
              for r in (d.get('results') or [])[:2]:
                  print(' ', json.dumps(r, ensure_ascii=False)[:1100])
          else:
              print(' ', json.dumps(d, ensure_ascii=False)[:900])
          " 2>&1 | head -30
          }

          echo "### 1) 日期区间过滤(管道核心)"
          dump "matches?filter%5Bmatches.start_date%5D%5Bgte%5D=2026-09-10T00:00:00.000%2B00:00&filter%5Bmatches.start_date%5D%5Blte%5D=2026-09-14T00:00:00.000%2B00:00&sort=start_date&page%5Blimit%5D=3"

          echo "### 2) include 队名/赛事名"
          dump "matches?include=team1,team2,tournament&page%5Blimit%5D=2"

          echo "### 3) 按 id 查队伍"
          dump "teams?filter%5Bteams.id%5D%5Beq%5D=19100"

          echo "### 4) 按 id 查赛事"
          dump "tournaments?filter%5Btournaments.id%5D%5Beq%5D=6075"

          echo "### 5) 进行中的比赛"
          dump "matches?filter%5Bmatches.status%5D%5Beq%5D=current&page%5Blimit%5D=3"

          echo "### 6) 即将开始(按时间正序)"
          dump "matches?filter%5Bmatches.status%5D%5Beq%5D=upcoming&sort=start_date&page%5Blimit%5D=3"
