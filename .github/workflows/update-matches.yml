name: Update matches

# 把 CS2 赛程/比分抓成 cs_matches.json 提交到 main 分支。
#
# 触发源说明:
#   - schedule: 每 2 小时一次,但**别指望它** —— GitHub 的定时触发不保证发生,
#     实测本仓库 cron 写 */10 时,26 小时里只调度到 1 次(数据断了 20 小时)。
#     所以每次调度到之后,由 refresh_loop.sh 在单次运行里自己轮询近 2 小时。
#   - push: 确定性兜底。改 .github/data-ping.txt 或相关脚本就能立刻跑一轮。
#   - workflow_dispatch: 需要 Actions 写权限,手上的 token 没有,基本用不上。
on:
  schedule:
    - cron: "0 */2 * * *"
  push:
    branches: [main]
    paths:
      - ".github/data-ping.txt"
      - "tools/update_matches.py"
      - "tools/purge_cdn.py"
      - ".github/refresh_loop.sh"
      - ".github/workflows/update-matches.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-matches
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 单次运行内反复刷新(默认 8 分钟一轮,跑满 115 分钟),
      # 这样即便 schedule 继续丢事件,数据也不会长时间停更。
      - name: Refresh loop
        env:
          REFRESH_EVERY: "480"
          PURGE_EVERY: "900"
          RUN_FOR: "6900"
        run: bash .github/refresh_loop.sh
