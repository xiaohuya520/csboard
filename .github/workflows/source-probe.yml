name: source-probe

# 临时探测(用完即删)。确认 bo3.gg games 端点的正确过滤语法。
on:
  push:
    paths:
      - ".github/probe-trigger.txt"
      - ".github/workflows/source-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: bo3.gg games filter syntax
        run: |
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
          bo3() {
            curl -s -o /tmp/b -w "%{http_code}" -m 30 -A "$UA" \
              -H "Origin: https://bo3.gg" -H "Referer: https://bo3.gg/" \
              -H "Accept: application/json" --compressed "$1"
          }
          # A) 最近的 games(带 match_id),看字段
          echo "=== A) latest games ==="
          code=$(bo3 "https://api.bo3.gg/api/v1/games?page%5Blimit%5D=5&sort=-begin_at")
          echo "http=$code bytes=$(wc -c < /tmp/b)"
          python3 -c "
          import json
          d=json.load(open('/tmp/b'))
          for g in d.get('results',[])[:5]:
              print('  game id=%s match_id=%s map=%s win=%s(%s) lose=%s(%s) rounds=%s begin=%s' % (
                g.get('id'), g.get('match_id'), g.get('map_name'),
                g.get('winner_clan_score'), g.get('winner_clan_name'),
                g.get('loser_clan_score'), g.get('loser_clan_name'),
                g.get('rounds_count'), g.get('begin_at')))
          " 2>&1 | head -20

          MID=$(python3 -c "
          import json
          d=json.load(open('/tmp/b'))
          for g in d.get('results',[]):
              if g.get('match_id'): print(g['match_id']); break
          " 2>/dev/null)
          echo "picked match_id=$MID"

          # B) 各种过滤语法
          for suffix in \
            "games?filter%5Bgames.match_id%5D%5Beq%5D=$MID&page%5Blimit%5D=5" \
            "games?filter%5Bmatch_id%5D%5Beq%5D=$MID&page%5Blimit%5D=5" \
            "games?match_id=$MID&page%5Blimit%5D=5" \
            "matches?filter%5Bmatches.id%5D%5Beq%5D=$MID" \
            "matches/$MID?include=games" ; do
            echo "----------------------------------------------------------"
            echo "PATH: $suffix"
            code=$(bo3 "https://api.bo3.gg/api/v1/$suffix")
            echo "http=$code bytes=$(wc -c < /tmp/b)"
            head -c 900 /tmp/b; echo
          done
