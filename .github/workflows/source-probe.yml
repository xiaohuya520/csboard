name: source-probe

# 临时探测(用完即删)。目标:
#   1) 在运行器里跑真实数据管道,看 Sofascore 到底通不通
#   2) 摸清 bo3.gg 的正确查询参数(它带地图名+每图回合分)
#   3) 试几个绕过 Cloudflare 的办法(HLTV)
on:
  push:
    paths:
      - ".github/probe-trigger.txt"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Real pipeline on the runner
        run: |
          set +e
          echo "=== running tools/update_matches.py for real ==="
          python3 tools/update_matches.py --out /tmp/m.json
          echo "exit=$?"
          if [ -f /tmp/m.json ]; then
            echo "bytes=$(wc -c < /tmp/m.json)"
            python3 - <<'PY'
          import json
          d = json.load(open("/tmp/m.json", encoding="utf-8"))
          ms = d.get("matches", [])
          print("matches=%d live=%d finished=%d upcoming=%d" % (
              len(ms), sum(1 for m in ms if m["status"]=="live"),
              sum(1 for m in ms if m["status"]=="finished"),
              sum(1 for m in ms if m["status"]=="upcoming")))
          scored = [m for m in ms if any((mp.get("s1") or mp.get("s2")) for mp in m.get("maps", []))]
          print("matches with a non-zero map score =", len(scored))
          named = [m for m in ms if any(mp.get("name","").startswith("Map ") is False for mp in m.get("maps", []))]
          print("matches with a real map name  =", len(named))
          for m in ms[:3]:
              print("  ", m["status"], m["team1"]["name"], m["score1"], "-", m["score2"], m["team2"]["name"], "maps=", m.get("maps"))
          PY
          fi

      - name: bo3.gg parameter sweep
        run: |
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
          try() {
            echo "----------------------------------------------------------"
            echo "URL: $1"
            CODE=$(curl -sS -o /tmp/b -w '%{http_code}' -m 25 -A "$UA" \
              -H "Origin: https://bo3.gg" -H "Referer: https://bo3.gg/" -H "Accept: application/json" "$1" 2>/tmp/e || true)
            echo "http=$CODE bytes=$(wc -c < /tmp/b)"
            head -c 700 /tmp/b | tr -d '\r\n'
            echo
            [ -s /tmp/e ] && head -c 200 /tmp/e
          }
          try "https://api.bo3.gg/api/v1/matches?page%5Blimit%5D=3"
          try "https://api.bo3.gg/api/v1/matches?page%5Blimit%5D=3&filter%5Bmatches.status%5D%5Beq%5D=finished"
          try "https://api.bo3.gg/api/v1/matches?page%5Blimit%5D=3&sort=-start_date"
          try "https://api.bo3.gg/api/v1/matches?page%5Blimit%5D=3&sort%5B0%5D=-start_date"
          try "https://api.bo3.gg/api/v1/matches/upcoming?page%5Blimit%5D=3"
          try "https://api.bo3.gg/api/v1/tournaments?page%5Blimit%5D=2"

      - name: Cloudflare bypass attempts for HLTV
        run: |
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
          show() {
            echo "----------------------------------------------------------"
            echo "URL: $1"
            CODE=$(curl -sSL -o /tmp/h -w '%{http_code}' -m 40 -A "$UA" "$1" 2>/dev/null || true)
            echo "http=$CODE bytes=$(wc -c < /tmp/h)"
            echo "mapwords: $(grep -oiE 'mirage|inferno|nuke|ancient|anubis|overpass|vertigo' /tmp/h | sort -u | tr '\n' ' ')"
            head -c 240 /tmp/h | tr -d '\r\n'
            echo
          }
          show "https://r.jina.ai/https://www.hltv.org/results?offset=0"
          show "https://r.jina.ai/https://www.hltv.org/matches/2383080/navi-vs-vitality"

      - name: Liquipedia match-level check
        run: |
          set +e
          get() {
            echo "----------------------------------------------------------"
            echo "PAGE: $1"
            curl -sS --compressed -m 30 \
              -H "User-Agent: csboard-firmware/1.0 (https://github.com/xiaohuya520/csboard; mwyjgl@126.com)" \
              -H "Accept-Encoding: gzip" \
              "https://liquipedia.net/counterstrike/api.php?action=parse&page=$2&prop=wikitext&format=json&formatversion=2" \
              -o /tmp/l
            echo "bytes=$(wc -c < /tmp/l)"
            python3 - <<'PY'
          import json, re
          try:
              d = json.load(open("/tmp/l", encoding="utf-8"))
          except Exception as e:
              print("parse fail", e); raise SystemExit
          wt = (d.get("parse") or {}).get("wikitext") or ""
          print("wikitext len =", len(wt))
          if not wt:
              print("keys:", list(d.keys()), str(d)[:200]); raise SystemExit
          for pat in (r"map1score\s*=", r"\|\s*maps?\s*=", r"\{\{Match", r"16\s*[-:]\s*\d+",
                      r"Mirage", r"Inferno"):
              hits = re.findall(pat, wt, re.I)
              print("   %-16s hits=%d %s" % (pat, len(hits), hits[:3]))
          i = wt.find("{{Match")
          if i >= 0:
              print("   MATCH TEMPLATE:", wt[i:i+400].replace("\n", " | "))
          PY
          }
          get "PGL/2025/Masters" "PGL%2F2025%2FMasters"
          get "BLAST Bounty 2026" "BLAST%20Bounty%202026"

      - name: done
        run: echo "probe finished"
